name: Android CI / Build & Auto-Repair

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Auto-reparar y actualizar Gradle si falta en el ZIP exportado
        run: |
          echo "Verificando integridad de Gradle y Gradle Wrapper..."
          
          # 1. Si gradlew o gradle-wrapper.properties o el jar no existen o están incompletos:
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ Se detectaron archivos de Gradle faltantes o incompletos (común al descargar como ZIP)."
            echo "🔧 Generando y restaurando Gradle Wrapper automáticamente..."
            
            # Instalar Gradle en el runner de GitHub Actions si no está presente
            if ! command -v gradle &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq gradle
            fi
            
            mkdir -p gradle/wrapper
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
          fi

          # 2. Asegurar configuración adecuada de gradle-wrapper.properties
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            mkdir -p gradle/wrapper
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          # 3. Asegurar permisos de ejecución en gradlew
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Permisos de ejecución otorgados a gradlew."
          fi

      - name: 🔍 Verificando recursos duplicados en XML...
        run: |
          echo "🔍 Verificando recursos duplicados en XML..."
          DUPLICATES=$(grep -R "<style name=" app/src/main/res/values/*.xml \
            | sed -E 's/.*<style name="([^"]+)".*/\1/' \
            | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Se encontraron estilos/temas duplicados:"
            echo "$DUPLICATES"
            exit 1
          else
            echo "✅ No se encontraron duplicados."
          fi

      - name: 🚀 Configurar Gradle con Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔨 Compilar APK Debug
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 📦 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chatmesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
