name: Android CI / Build & Auto-Repair

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21 (Requerido por AGP 9.1+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📋 Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: ⚙️ Auto-reparar y actualizar Gradle si falta en el ZIP exportado
        run: |
          echo "Verificando integridad de Gradle y Gradle Wrapper..."
          
          mkdir -p gradle/wrapper
          
          # Asegurar configuración adecuada de gradle-wrapper.properties para Gradle 9.3.1
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Asegurar permisos de ejecución en gradlew si existe
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Permisos de ejecución otorgados a gradlew."
          fi

      - name: 🔍 Verificando recursos duplicados en XML...
        run: |
          echo "🔍 Verificando recursos duplicados en XML..."
          DUPLICATES=$(grep -R "<style name=" app/src/main/res/values/*.xml \
            | sed -E 's/.*<style name="([^"]+)".*/\1/' \
            | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Se encontraron estilos/temas duplicados:"
            echo "$DUPLICATES"
            exit 1
          else
            echo "✅ No se encontraron duplicados."
          fi

      - name: 🚀 Configurar Gradle 9.3.1 con Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: 🔨 Compilar APK Debug
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 📦 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chatmesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
