name: Android CI / Build & Auto-Repair

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21 (Requerido por AGP 9.1+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📋 Aceptar licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: ⚙️ Auto-reparar y actualizar Gradle si falta en el ZIP exportado
        run: |
          echo "Verificando integridad de Gradle y Gradle Wrapper..."
          
          mkdir -p gradle/wrapper
          
          # Asegurar configuración adecuada de gradle-wrapper.properties para Gradle 9.3.1
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Asegurar permisos de ejecución en gradlew si existe
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Permisos de ejecución otorgados a gradlew."
          fi

      - name: 🔍 Verificando recursos duplicados en XML...
        run: |
          echo "🔍 Verificando recursos duplicados en XML..."
          DUPLICATES=$(grep -R "<style name=" app/src/main/res/values/*.xml \
            | sed -E 's/.*<style name="([^"]+)".*/\1/' \
            | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Se encontraron estilos/temas duplicados:"
            echo "$DUPLICATES"
            exit 1
          else
            echo "✅ No se encontraron duplicados."
          fi

      - name: 🚀 Configurar Gradle 9.3.1 con Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: 🔨 Compilar APK Debug
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 🏷️ Preparar archivo APK
        run: |
          # Copiar el archivo APK generado con un nombre limpio y reconocible
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChatMesh.apk
            echo "✅ APK preparado exitosamente como ChatMesh.apk"
          else
            echo "⚠️ Buscando APK alternativo..."
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} app/build/outputs/apk/debug/ChatMesh.apk \;
          fi

      - name: 📦 Subir APK a Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ChatMesh-APK
          path: app/build/outputs/apk/debug/ChatMesh.apk
          retention-days: 14

      - name: 🚀 Publicar APK en Releases para descarga directa en 1 clic
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "ChatMesh - Última Versión Disponible"
          body: |
            ### 📱 ChatMesh APK para Android
            - Descarga directa del instalador APK para tu teléfono.
            - No requiere internet: comunicación y llamadas por WiFi Direct P2P y Wi-Fi Aware.
            
            **Instalación:**
            1. Descarga el archivo `ChatMesh.apk` que aparece abajo en **Assets**.
            2. Ábrelo en tu dispositivo Android y pulsa **Instalar**.
          files: app/build/outputs/apk/debug/ChatMesh.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Resumen del Build
        run: |
          echo "## 🎉 ¡ChatMesh compilado exitosamente!" >> $GITHUB_STEP_SUMMARY
          echo "El archivo APK está listo para descargar:" >> $GITHUB_STEP_SUMMARY
          echo "- **Nombre de archivo:** \`ChatMesh.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Opciones de descarga:**" >> $GITHUB_STEP_SUMMARY
          echo "  1. En esta misma ejecución, baja hasta la sección **Artifacts** y pulsa en **ChatMesh-APK**." >> $GITHUB_STEP_SUMMARY
          echo "  2. O en la página principal de tu repositorio de GitHub, entra en la pestaña **Releases** en la columna derecha para descargarlo en 1 solo clic." >> $GITHUB_STEP_SUMMARY
